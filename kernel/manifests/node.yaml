apiVersion: turboquant.ai/v1alpha1
kind: Node
metadata:
  name: delhi-gpu-01
  namespace: testnet
  labels:
    turboquant.ai/region: india-north
    turboquant.ai/owner: febin
    turboquant.ai/node-class: gpu
    turboquant.ai/trust-tier: testnet
    turboquant.ai/runtime: inference
spec:
  identity:
    mode: did
    did: did:key:z6MkExample
  endpoint:
    protocol: mtls
    address: https://delhi-gpu-01.testnet.internal
  capabilities:
    mcp:
      - github
      - postgres
    cpu:
      architecture: amd64
      cores: 16
      memoryGiB: 64
    gpu:
      vendor: nvidia
      model: rtx-3060
      memoryGiB: 12
      count: 1
    storage:
      availableGiB: 2048
    settlement:
      accountRef: febin-node-credit
      mode: internal-credits
  policies:
    workloadPolicyRef: testnet-standard
  status:
    phase: Pending
    observedGeneration: 0
    conditions: []