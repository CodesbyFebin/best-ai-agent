apiVersion: turboquant.ai/v1alpha1
kind: ComputeRequest
metadata:
  name: langgraph-inference-001
  namespace: testnet
spec:
  workloadRef:
    kind: Agent
    name: langgraph-research-agent
generators:
  requirements:
    runtime: inference
    accelerator:
      type: gpu
      minimumMemoryGiB: 8
    budget:
      maximumCredits: 25
    verification:
      policyRef: sampled-inference-v1
testExecution:
  retryPolicy:
    maximumAttempts: 3
    backoff: exponential