name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:quarantine
      - run: npm run build
      - name: Verify invariants
        run: npx tsx scripts/verify-invariants.ts
      - name: Verify evidence
        run: npx tsx scripts/verify-evidence.ts
      - name: Verify sitemap
        run: npx tsx scripts/verify-sitemaps.ts
      - name: Verify SSR
        run: npx tsx scripts/verify-ssr.ts
      - name: Verify routes
        run: npx tsx scripts/verify-routes.ts
      - name: Verify redirects
        run: npx tsx scripts/verify-redirects.ts
      - name: Verify manifest
        run: npx tsx scripts/verify-manifest.ts
      - name: Verify scope freeze
        run: npx tsx scripts/verify-scope-freeze.tsx
