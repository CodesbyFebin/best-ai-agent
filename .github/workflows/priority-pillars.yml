name: Priority Pillars

on:
  pull_request:
    paths:
      - 'src/components/pillars/**'
      - 'src/App.tsx'
      - 'src/routing/**'
      - 'content/manifests/priority-pillars.yaml'
      - 'scripts/verify-priority-pillars.ts'
      - 'package.json'
  push:
    branches: [main, 'feat/priority-pillars-seo-aeo-geo']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:pillars
      - run: npm run build
