name: Bug report
description: Report something that is broken or behaves incorrectly in Best AI Agent
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. A few things first:
        - For **security vulnerabilities**, do **not** use this form. Report them privately via [GitHub Security Advisories](https://github.com/CodesbyFebin/best-ai-agent/security/advisories/new) — see [SECURITY.md](../../SECURITY.md).
        - For evidence/source disputes (a claim you believe is wrong), use the **Documentation** template instead and link the evidence receipt.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps. Include the URL or route if this is about a page or redirect.
      placeholder: |
        1. Run `npm run dev`
        2. Open http://localhost:3000/agents/...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / branch
      description: The `git` commit the bug was observed on (`git rev-parse --short HEAD`).
      placeholder: a54d4fa
    validations:
      required: true
  - type: dropdown
    id: runner-mode
    attributes:
      label: Run mode
      options:
        - `npm run dev` (local, Vite HMR)
        - `npm start` (production bundle)
        - Vercel preview / deployed
        - Other (describe in logs)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste from `npm run dev`, the browser console, or a `verify-*` script. Use fenced code blocks.
      render: shell
  - type: checkboxes
    id: verify-ran
    attributes:
      label: Pre-flight
      options:
        - label: I ran `npm run lint` and `npm run build` locally and confirmed the bug is not already fixed.
          required: false
